[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "amix"
version = "0.4.0"
description = "AMIX local engine"
requires-python = ">=3.12"
dependencies = [
    "SQLAlchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "fastapi>=0.115,<1",
    "pydantic>=2,<3",
    "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1",
]

[tool.setuptools]
package-dir = { "amix" = "." }
packages = [
    "amix",
    "amix.amix_engine",
    "amix.amix_engine.analysis",
    "amix.amix_engine.domain",
    "amix.amix_engine.jobs",
    "amix.amix_engine.multicam",
    "amix.amix_engine.service",
    "amix.amix_engine.storage",
    "amix.amix_engine.time",
]
